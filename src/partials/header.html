<header class="site-header" id="top">
  <div class="container header-inner">
    <a class="brand" href="{{link:home}}" aria-label="Vinyl Wrapsody home">
      <img src="{{asset:img/logo.png}}" alt="Vinyl Wrapsody" width="88" height="88">
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <ul>
        <li><a href="{{link:home}}">Home</a></li>
        <li><a href="{{link:commercial}}">Commercial Wrapping</a></li>
        <li><a href="{{link:kitchen}}">Kitchen Wrapping</a></li>
        <li class="has-sub">
          <button type="button" class="sub-toggle" aria-expanded="false" aria-controls="loc-menu">Locations <span aria-hidden="true">▾</span></button>
          <ul class="sub" id="loc-menu">
            {{#each locations}}<li><a href="{{link:loc-{{this.slug}}}}">Vinyl Wrapping in {{this.town}}</a></li>{{/each}}
          </ul>
        </li>
        <li><a href="{{link:contact}}">Contact</a></li>
      </ul>
      <div class="nav-contact">
        <a class="nav-phone" href="tel:{{site.phoneIntl}}" data-track="click_call"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span>{{site.phoneDisplay}}</span></a>
        <a class="nav-wa" href="https://wa.me/{{site.whatsapp}}?text=Hi%20Vinyl%20Wrapsody%2C%20I%27d%20like%20a%20quote%20for%20vinyl%20wrapping." target="_blank" rel="noopener" data-track="click_whatsapp" aria-label="Chat on WhatsApp"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.1-.8 1-1 1.2-.4.2-.7.1a8.2 8.2 0 0 1-4-3.5c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.8.4 3.5 3.5 0 0 0-1.1 2.6 6.1 6.1 0 0 0 1.3 3.2 13.9 13.9 0 0 0 5.3 4.7c2 .8 2.7.9 3.7.7a3.2 3.2 0 0 0 2.1-1.5 2.6 2.6 0 0 0 .2-1.5c-.1-.1-.3-.2-.6-.3zM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.9 17.8L.2 24l6.3-1.7a11.8 11.8 0 0 0 5.6 1.4A11.8 11.8 0 0 0 20.4 3.6z"/></svg></a>

      </div>
    </nav>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Open menu"><span></span><span></span><span></span></button>
  </div>
</header>
