<dialog class="quote-modal" id="quote-modal" aria-labelledby="quote-modal-title">
  <div class="quote-modal-inner">
    <button type="button" class="modal-close" data-close-quote aria-label="Close">×</button>
    <p class="eyebrow">Free, no-obligation quote</p>
    <h2 id="quote-modal-title">Tell us what you'd like wrapped</h2>
    <p class="lead-sm">Takes about a minute. We'll come back with a price and available dates.</p>
    {{> quote-form-fields}}
  </div>
</dialog>
